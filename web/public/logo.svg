<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="VibeDND">
  <!-- Вариант 2 «Классический d20»: полная проекция икосаэдра — шестиугольник,
       внутренняя грань-треугольник вершиной вниз и три спицы к силуэту.
       V образуют два наклонных ребра передней грани (яркое золото),
       остальные рёбра — фирменное золото тусклее. -->
  <rect x="0" y="0" width="64" height="64" rx="13" fill="#14101c"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- силуэт d20 -->
    <path d="M32 3 L57.1 17.5 L57.1 46.5 L32 61 L6.9 46.5 L6.9 17.5 Z"
          stroke="#c9a227" stroke-width="3.4"/>
    <!-- спицы внутренней грани к силуэту -->
    <path d="M13.5 20.5 L6.9 17.5 M50.5 20.5 L57.1 17.5 M32 52 L32 61"
          stroke="#c9a227" stroke-width="3.2" opacity="0.6"/>
    <!-- верхнее ребро передней грани -->
    <path d="M13.5 20.5 L50.5 20.5" stroke="#c9a227" stroke-width="3.2" opacity="0.8"/>
    <!-- V: два наклонных ребра передней грани, без заливки -->
    <path d="M13.5 20.5 L32 52 L50.5 20.5" stroke="#f0c948" stroke-width="3.8"/>
  </g>
</svg>
